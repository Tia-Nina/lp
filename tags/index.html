<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" type="text/css" href="index.css">
        <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    </head>

    <body>
        <div id="menu" class="settings-panel">
            <div class="setting-item file-setting">
                <label class="setting-label">导入表格</label>
                <input type="file" id="fileInput" accept=".xlsx,.xls" />
            </div>

            <div class="setting-group">
                <div class="setting-item">
                    <label class="setting-label" for="quantityMode">
                        数量显示模式
                    </label>
                    <select id="quantityMode">
                        <option value="1">固定为1</option>
                        <option value="read">从表格读取</option>
                        <option value="dyn">依次动态选择</option>
                    </select>
                </div>

                <div class="setting-qrcode">
                    <div class="setting-item">
                        <label class="setting-label" for="qrcodeText">
                            二维码下方文字
                        </label>
                        <input type="text" id="qrcodeText" placeholder="请输入显示文字"/>
                    </div>
                    <div id="qrcodeTextOptions"></div>
                </div>
            </div>
        </div>

        <div id="content"></div>
    </body>
    <script type="text/javascript" src="index.js"></script>
</html>
