<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />

        <style>
            @page {
                size: A4 landscape;
                margin: 8mm;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 0;
            }

            /* 上传区域 */
            #menu {
                margin-bottom: 10px;
            }

            /*
            一页 A4 横向
            297mm × 210mm
            去掉左右上下 8mm
            = 281mm × 194mm
            */
            .page {
                width: 281mm;
                height: 194mm;

                display: grid;

                grid-template-columns: 1fr 1fr;
                grid-template-rows: repeat(3, 1fr);

                column-gap: 5mm;
                row-gap: 5mm;

                page-break-after: always;
                break-after: page;
            }

            .page:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            /* 单个标签 */
            .aTable {
                width: 100%;
                height: 100%;

                overflow: hidden;
            }

            /* 内部表格 */

            table {
                width: 100%;
                height: 100%;

                border-collapse: collapse;

                font-size: 12px;
            }

            th,
            td {
                border: 1px solid #dddddd;

                text-align: center;

                font-weight: bold;
            }

            th {
                background: #f2f2f2;
            }

            img {
                width: 60px;
                height: 60px;
            }

            @media print {
                #menu {
                    display: none;
                }
            }
        </style>

        <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    </head>

    <body>
        <div id="menu">
            <input type="file" id="fileInput" accept=".xlsx,.xls" />
        </div>

        <div id="content"></div>

        <script>
            let groupedData;
            let extraNote;

            function arrGroup(arr, fn) {
                const obj = {};

                arr.forEach((item) => {
                    const key = JSON.stringify(fn(item));

                    obj[key] ??= [];

                    obj[key].push(item);
                });

                return Object.values(obj);
            }

            function createTable() {
                const content = document.getElementById("content");

                let page = null;

                let count = 0;

                function addLabel(label) {
                    if (count % 6 === 0) {
                        page = document.createElement("div");

                        page.className = "page";

                        content.appendChild(page);
                    }

                    page.appendChild(label);

                    count++;
                }

                for (let i in groupedData) {
                    for (let j = 0; j < groupedData[i][0].totalAmount; j++) {
                        let table = document.createElement("table");

                        let header = document.createElement("tr");

                        ["图号", "数量", "计生号", "辆份"].forEach((text) => {
                            let th = document.createElement("th");

                            th.textContent = text;

                            header.appendChild(th);
                        });

                        table.appendChild(header);

                        groupedData[i].forEach((material, index) => {
                            let row = document.createElement("tr");

                            let td1 = document.createElement("td");

                            td1.textContent = material.materialNo;

                            row.appendChild(td1);

                            let td2 = document.createElement("td");

                            td2.textContent = "1";

                            row.appendChild(td2);

                            if (index === 0) {
                                let td3 = document.createElement("td");

                                let span = document.createElement("span");

                                span.style.fontSize = "x-large";

                                span.style.fontWeight = "bold";

                                span.textContent = material.planNo.split("-")[1];

                                td3.appendChild(span);

                                td3.appendChild(document.createElement("br"));

                                td3.appendChild(
                                    document.createTextNode(
                                        material.planNo + "-" + String(material.no).padStart(4, "0")
                                    )
                                );

                                td3.appendChild(document.createElement("br"));

                                td3.appendChild(document.createTextNode(material.special));

                                td3.rowSpan = groupedData[i].length;

                                row.appendChild(td3);
                            }

                            if (index === 0) {
                                let td4 = document.createElement("td");

                                td4.textContent = material.totalAmount + "-" + (j + 1);

                                let img = document.createElement("img");

                                img.src = "https://picdl.sunbangyan.cn/2023/11/18/d7a30ef05dfe0b9736b015ccd8f340c4.jpg";

                                td4.appendChild(document.createElement("br"));

                                td4.appendChild(img);

                                td4.appendChild(document.createElement("br"));

                                td4.appendChild(document.createTextNode(extraNote));

                                td4.rowSpan = groupedData[i].length + 1;

                                row.appendChild(td4);
                            }

                            table.appendChild(row);
                        });

                        let last = document.createElement("tr");

                        let td = document.createElement("td");

                        td.colSpan = 3;

                        td.textContent = groupedData[i][0].taskNo;

                        last.appendChild(td);

                        table.appendChild(last);

                        let box = document.createElement("div");

                        box.className = "aTable";

                        box.appendChild(table);

                        addLabel(box);
                    }
                }
            }

            document.getElementById("fileInput").addEventListener("change", function (e) {
                let file = e.target.files[0];

                let reader = new FileReader();

                reader.onload = function (e) {
                    let data = new Uint8Array(e.target.result);

                    let workbook = XLSX.read(data, { type: "array" });

                    let sheet = workbook.Sheets[workbook.SheetNames[0]];

                    let rows = XLSX.utils.sheet_to_json(sheet);

                    let jsonArray = rows.map((item) => ({
                        taskNo: item["任务号"],

                        materialNo: item["物料编码"],

                        totalAmount: item["总量"],

                        no: item["序号"],

                        special: item["计生号"] || item["特殊描述"],

                        planNo: item["装配计划号"] || "",
                    }));

                    groupedData = arrGroup(
                        jsonArray,
                        (item) => item.taskNo + "&&" + item.special + "&&" + item.no + "&&" + item.planNo
                    );

                    extraNote = prompt("输入在二维码下方要显示的文字");

                    document.getElementById("menu").style.display = "none";

                    createTable();
                };

                reader.readAsArrayBuffer(file);
            });
        </script>
    </body>
</html>
